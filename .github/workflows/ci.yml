name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Backend Code
        run: |
          cd exp_8/server
          npm install --omit=dev
          node -c server.js

      - name: Build Frontend Application
        run: |
          cd exp_8/client
          npm install
          npm run build

